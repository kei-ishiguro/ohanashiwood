<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイトルから探す｜昔話の森</title>
<style>
:root{
  --ink:#35483d;--green:#66866c;--paper:#fffaf0;
  --gold:#d8ad5c;--soft:#edf2e7;--brown:#87684d;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);font-family:"Yu Gothic","Meiryo",sans-serif;
  background:linear-gradient(180deg,#f3eadb 0,#fffaf0 390px);min-height:100vh;
}
header{text-align:center;padding:25px 16px 8px}
.kicker{font-size:14px;letter-spacing:.16em;color:#91806b}
h1{font-family:serif;font-size:clamp(27px,5vw,39px);margin:8px 0;color:#765b3b}
.lead{font-size:15px;line-height:1.9;margin:0 auto;max-width:650px}
.book{font-size:43px;margin:15px 0 5px;animation:float 3.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(5px) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
main{max-width:900px;margin:0 auto;padding:12px 18px 40px}
.panel{
  background:rgba(255,255,255,.9);border:1px solid #e5dfce;border-radius:24px;
  padding:clamp(15px,3vw,28px);box-shadow:0 8px 26px #52634a14;
}
.instructions{text-align:center;margin:0 0 10px;font-size:16px;font-weight:bold}
.subtext{text-align:center;color:#718075;font-size:13px;line-height:1.8;margin:0}
.title-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.title-button{
  border:2px solid #e6ddca;border-radius:16px;background:#fffaf0;color:var(--ink);
  min-height:100px;padding:18px 12px;font-family:serif;font-size:19px;font-weight:bold;
  cursor:pointer;transition:transform .18s,background .18s,border-color .18s;
}
.title-button:hover{transform:translateY(-3px);background:#fff4df}
.title-button.selected{background:#f8e9c9;border-color:#c49a55}
.title-button small{display:block;font-family:"Yu Gothic","Meiryo",sans-serif;font-size:12px;font-weight:normal;color:#88775f;margin-top:8px}
.item-area{display:none;margin-top:22px;padding:18px;background:#fff;border:1px solid #e2e2d4;border-radius:16px}
.item-area.show{display:block;animation:appear .25s ease}
.selected-title{text-align:center;background:#fff1d9;border-radius:12px;padding:13px;margin:12px 0 18px;font-size:19px;font-weight:bold;color:#76552d}
.item-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.item-button{
  min-height:100px;border:2px solid #e1e5d9;border-radius:13px;background:#fff;color:var(--ink);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  font-size:15px;font-weight:bold;transition:.18s;
}
.item-button:hover{background:#f7f8ef;transform:translateY(-2px)}
.item-button.selected{background:#e8f1e4;border-color:#66866c}
.item-button:disabled{opacity:.42;cursor:default;transform:none}
.emoji{font-size:30px}
.selection-count{text-align:center;margin:18px 0 10px;color:#52735a;font-weight:bold}
.action-button{
  display:block;width:100%;max-width:320px;margin:12px auto 0;padding:13px 18px;border:0;border-radius:999px;
  background:#66866c;color:white;font-size:16px;font-weight:bold;cursor:pointer;
}
.action-button:disabled{background:#b8c2b5;cursor:default}
.reset-button{display:block;margin:12px auto 0;border:0;background:transparent;color:#66866c;text-decoration:underline;cursor:pointer;font-size:14px}
.result{display:none;margin-top:20px;padding:20px;border-radius:14px;background:#fff6df;border:1px solid #e5d4a7;text-align:center}
.result.show{display:block;animation:appear .3s ease}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result h2{font-family:serif;font-size:22px;color:#76552d;margin:8px 0}
.result p{line-height:1.8}
.result .book-icon{font-size:36px}
.back{display:inline-block;margin-top:20px;color:#52735a;text-decoration:none;font-weight:bold}
.back:hover{text-decoration:underline}
footer{text-align:center;padding:0 16px 28px;color:#7b877b;font-size:13px}
@media(max-width:560px){
  header{padding-top:18px}.lead{font-size:14px}.title-grid{grid-template-columns:1fr}
  .item-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{padding:13px;border-radius:18px}.item-area{padding:12px}
}
</style>
</head>
<body>
<header>
  <div class="kicker">おはなしの森を たんけんしよう</div>
  <h1>タイトルから探す</h1>
  <p class="lead">昔話のタイトルを選んでみよう。<br>そのお話に出てくるアイテムを、3つ見つけられるかな？</p>
  <div class="book" aria-hidden="true">📖</div>
</header>

<main>
<section class="panel">
  <p class="instructions">どのお話に挑戦する？</p>
  <p class="subtext">タイトルを選ぶと、アイテムが並ぶよ。</p>

  <div class="title-grid" id="title-grid"></div>

  <div class="item-area" id="item-area">
    <p class="instructions">このお話に出てくるアイテムを3つ選んでね</p>
    <div class="selected-title" id="selected-title"></div>
    <div class="item-grid" id="item-grid"></div>
    <div class="selection-count" id="selection-count" aria-live="polite">0 / 3 個選択中</div>
    <button class="action-button" id="check-items" disabled>答えをたしかめる</button>
    <button class="reset-button" id="reset-items">選びなおす</button>

    <div class="result" id="result" aria-live="polite">
      <div class="book-icon">📚</div>
      <h2 id="result-title"></h2>
      <p id="result-message"></p>
    </div>
  </div>
</section>

<div style="text-align:center">
  <a class="back" href="index.html">← 不思議な存在の地図にもどる</a>
</div>
</main>

<footer>昔話の森 ― 世界の物語をたずねる旅</footer>

<script>
// お話ごとのアイテム対応。新しい昔話を追加するときは、ここに登録します。
const stories = [
  {
    id:"kobutori",
    title:"『こぶとりじいさん』",
    hint:"鬼たちとおじいさんのお話",
    items:["こぶ","踊り","太鼓"],
    message:"正解！鬼たちの宴に招かれたおじいさん。踊ったおじいさんのこぶは、どうなったのでしょう？"
  },
  {
    id:"daiku",
    title:"『大工と鬼六』",
    hint:"橋をかける大工と鬼のお話",
    items:["大工","橋","山"],
    message:"正解！川に橋をかけることになった大工。鬼との約束を思い出してみよう。"
  }
];

// アイテム候補
const items = [
  {name:"こぶ",emoji:"🔴"},
  {name:"踊り",emoji:"💃"},
  {name:"大工",emoji:"🪚"},
  {name:"橋",emoji:"🌉"},
  {name:"山",emoji:"⛰️"},
  {name:"太鼓",emoji:"🥁"},
  {name:"刀",emoji:"⚔️"},
  {name:"宝物",emoji:"💎"}
];

const titleGrid=document.getElementById("title-grid");
const itemArea=document.getElementById("item-area");
const selectedTitle=document.getElementById("selected-title");
const itemGrid=document.getElementById("item-grid");
const selectionCount=document.getElementById("selection-count");
const checkItems=document.getElementById("check-items");
const result=document.getElementById("result");
const resultTitle=document.getElementById("result-title");
const resultMessage=document.getElementById("result-message");

let currentStory=null;
let selectedItems=[];

function createTitleButtons(){
  titleGrid.replaceChildren();
  stories.forEach(story=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="title-button";
    button.dataset.story=story.id;
    button.textContent=story.title;
    const small=document.createElement("small");
    small.textContent=story.hint;
    button.appendChild(small);
    button.addEventListener("click",()=>chooseStory(story));
    titleGrid.appendChild(button);
  });
}

function chooseStory(story){
  currentStory=story;
  selectedItems=[];
  selectedTitle.textContent=story.title;
  document.querySelectorAll(".title-button").forEach(button=>{
    button.classList.toggle("selected",button.dataset.story===story.id);
  });
  result.classList.remove("show");
  itemArea.classList.add("show");
  createItemButtons();
  updateSelection();
  itemArea.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function createItemButtons(){
  itemGrid.replaceChildren();
  items.forEach(item=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="item-button";
    button.dataset.item=item.name;
    button.setAttribute("aria-pressed","false");
    const emoji=document.createElement("span");
    emoji.className="emoji";
    emoji.textContent=item.emoji;
    const name=document.createElement("span");
    name.textContent=item.name;
    button.append(emoji,name);
    button.addEventListener("click",()=>toggleItem(item.name));
    itemGrid.appendChild(button);
  });
}

function toggleItem(name){
  if(selectedItems.includes(name)){
    selectedItems=selectedItems.filter(item=>item!==name);
  }else{
    if(selectedItems.length>=3)return;
    selectedItems.push(name);
  }
  updateSelection();
}

function updateSelection(){
  document.querySelectorAll(".item-button").forEach(button=>{
    const selected=selectedItems.includes(button.dataset.item);
    button.classList.toggle("selected",selected);
    button.setAttribute("aria-pressed",String(selected));
    button.disabled=!selected && selectedItems.length===3;
  });
  selectionCount.textContent=selectedItems.length+" / 3 個選択中";
  checkItems.disabled=selectedItems.length!==3;
  result.classList.remove("show");
}

document.getElementById("reset-items").addEventListener("click",()=>{
  selectedItems=[];
  updateSelection();
  result.classList.remove("show");
});

checkItems.addEventListener("click",()=>{
  if(!currentStory||selectedItems.length!==3)return;
  const selected=selectedItems.slice().sort();
  const answer=currentStory.items.slice().sort();
  const isCorrect=answer.every((item,index)=>item===selected[index]);

  resultTitle.textContent=isCorrect?"ぴったり見つけた！":"もう少し探してみよう";
  resultMessage.textContent=isCorrect
    ?currentStory.message
    :"選んだアイテムの中に、違うものがあるみたい。選びなおしてみてね。";
  result.classList.add("show");
  result.scrollIntoView({behavior:"smooth",block:"nearest"});
});

createTitleButtons();
</script>
</body>
</html>
