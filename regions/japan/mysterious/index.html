<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本の昔話を探そう｜昔話の森</title>
<style>
:root {
  --ink: #35483d;
  --green: #66866c;
  --paper: #fffaf0;
  --gold: #d8ad5c;
  --soft: #edf2e7;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  background: linear-gradient(180deg, #e9f3f1 0, #fffaf0 420px);
}
header {
  text-align: center;
  padding: 32px 16px 12px;
}
.kicker {
  font-size: 14px;
  letter-spacing: .18em;
  color: #718b7b;
}
h1 {
  font-size: clamp(28px, 5vw, 42px);
  margin: 10px 0;
  color: #496b54;
}
.lead {
  max-width: 650px;
  margin: 0 auto;
  font-size: 16px;
  line-height: 1.9;
}
.balloon-wrap {
  height: 100px;
  position: relative;
  overflow: hidden;
}
.balloon {
  position: absolute;
  left: calc(50% - 24px);
  top: 8px;
  font-size: 48px;
  animation: float 3.8s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(8px) rotate(-4deg); }
  50% { transform: translateY(-8px) rotate(4deg); }
}
main {
  max-width: 850px;
  margin: 0 auto;
  padding: 10px 18px 42px;
}
.choice-card {
  background: rgba(255,255,255,.9);
  border: 1px solid #e5dfce;
  border-radius: 24px;
  padding: clamp(18px, 4vw, 32px);
  box-shadow: 0 8px 26px #52634a14;
  text-align: center;
}
.question {
  font-size: clamp(23px, 4vw, 30px);
  font-weight: bold;
  color: #496b54;
  margin: 0 0 8px;
}
.note {
  color: #718075;
  font-size: 14px;
  line-height: 1.8;
  margin: 0;
}
.button-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  max-width: 680px;
  margin: 26px auto 8px;
}
.play-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 210px;
  padding: 22px 16px;
  border: 1px solid #dfe4d5;
  border-radius: 22px;
  background: #fff;
  color: var(--ink);
  text-decoration: none;
  box-shadow: 0 8px 22px rgba(66,87,61,.10);
  transition: transform .2s, box-shadow .2s, background .2s;
}
.play-button:hover, .play-button:focus-visible {
  transform: translateY(-4px);
  background: #fff9ed;
  box-shadow: 0 12px 26px rgba(66,87,61,.16);
  outline: 2px solid #b7c9a9;
  outline-offset: 2px;
}
.button-icon {
  font-size: 68px;
  line-height: 1.2;
  margin-bottom: 12px;
}
.button-title {
  font-size: 20px;
  font-weight: bold;
  margin: 0 0 8px;
}
.button-description {
  font-size: 14px;
  line-height: 1.7;
  color: #718075;
  margin: 0 0 16px;
}
.button-cta {
  margin-top: auto;
  display: inline-block;
  border-radius: 999px;
  padding: 10px 22px;
  background: var(--green);
  color: white;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 3px 0 #4e6d54;
}
.back {
  display: inline-block;
  margin-top: 22px;
  color: #52735a;
  text-decoration: none;
  font-weight: bold;
}
.back:hover { text-decoration: underline; }
footer {
  text-align: center;
  padding: 0 16px 28px;
  color: #7b877b;
  font-size: 13px;
}
@media (max-width: 560px) {
  header { padding-top: 22px; }
  .lead { font-size: 14px; }
  .button-list { grid-template-columns: 1fr; max-width: 340px; gap: 14px; }
  .play-button { min-height: 185px; }
}
</style>
</head>
<body>
<header>
  <div class="kicker">おはなしの森を たんけんしよう</div>
  <h1>日本のふしぎなそんざい</h1>
  <p class="lead">
    日本の昔話の世界へようこそ。<br>
    どんなお話やアイテムに出会えるかな？
  </p>
  <div class="balloon-wrap" aria-hidden="true">
    <div class="balloon">🎈</div>
  </div>
</header>

<main>
  <section class="choice-card" aria-label="遊び方を選ぶ">
    <h2 class="question">どちらのあそびをする？</h2>
    <p class="note">好きな遊びをえらんでね。</p>

    <div class="button-list">
      <a class="play-button" id="items-link" href="items.html">
        <span class="button-icon" aria-hidden="true">🎁</span>
        <p class="button-title">アイテムからえらぶ</p>
        <p class="button-description">アイテムをえらんで、<br>何のお話か探そう</p>
        <span class="button-cta">あそんでみる →</span>
      </a>

      <a class="play-button" id="titles-link" href="titles.html">
        <span class="button-icon" aria-hidden="true">📖</span>
        <p class="button-title">タイトルからあそぶ</p>
        <p class="button-description">お話をえらんで、<br>登場するアイテムを探そう</p>
        <span class="button-cta">あそんでみる →</span>
      </a>
    </div>
  </section>

  <div style="text-align:center">
    <a class="back" href="../../../index.html">← 昔話の森にもどる</a>
  </div>
</main>

<footer>昔話の森 ― 世界の物語をたずねる旅</footer>

<script>
// URLに地域が指定されている場合は、次のページにも引き継ぐ
const params = new URLSearchParams(window.location.search);
const region = params.get("region") || "japan";

document.getElementById("items-link").href =
  "items.html?region=" + encodeURIComponent(region);
document.getElementById("titles-link").href =
  "titles.html?region=" + encodeURIComponent(region);
</script>
</body>
</html>
